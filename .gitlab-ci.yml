include:
  - local: triage.gitlab-ci.yml

# This repo's own CI. It never shares a pipeline with triage: that one is
# trigger-only, this one is push/MR-only.
test:
  image: node:24-alpine
  rules:
    # Narrowing the push entry to the default branch keeps a merge request
    # branch push from running this a second time alongside the MR pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  before_script:
    - apk add --no-cache bash git jq
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    # Builds, checks dist parses, runs the node tests, then scripts/test-*.sh
    # against stub glab and agent.
    - pnpm test
